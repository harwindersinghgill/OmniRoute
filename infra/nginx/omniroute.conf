server {
    listen 48924 ssl http2;
    listen [::]:48924 ssl http2;
    server_name _;

    allow 127.0.0.1;
    allow ::1;
    allow 118.100.109.0/24;
    allow 2001:e68:544f::/48;
    deny all;

    ssl_certificate     /etc/nginx/ssl/omniroute.pem;
    ssl_certificate_key /etc/nginx/ssl/omniroute.key;

    # Static assets (content-hashed by Next.js — safe to cache aggressively)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:20130;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:20130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE correctness (2026-09-11 incident): unbuffered streaming so the
        # gateway's X-Accel-Buffering / heartbeat frames reach the client
        # immediately. proxy_read_timeout stays 600s (harmless behind the
        # Cloudflare 125s edge cap, which remains the binding limit).
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }
}
